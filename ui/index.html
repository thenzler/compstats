<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTI-STRAT · CompStats</title>
<style>
  html,body{margin:0;padding:0;background:#0B0C0E;height:100%}
  *{box-sizing:border-box}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#262A32}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:#E8E9EA}
  input[type=range]:hover::-webkit-slider-thumb{background:#5B8DEF}
  ::selection{background:#5B8DEF33}
  .row-hover:hover{background:#1B1E24}
  .pill:hover{opacity:.8;cursor:pointer}
  .map-item:hover{border-color:#262A32!important;cursor:pointer}
  .tab-btn{cursor:pointer}
  .tab-btn:hover{color:#E8E9EA!important}
  .sort-hd{cursor:pointer}
  .sort-hd:hover{color:#5B8DEF!important}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:#0B0C0E}
  ::-webkit-scrollbar-thumb{background:#262A32}
  ::-webkit-scrollbar-thumb:hover{background:#3A3F47}
</style>
</head>
<body>
<div style="height:100vh;display:flex;flex-direction:column;background:#0B0C0E;color:#E8E9EA;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden">

  <!-- Header -->
  <div style="height:44px;flex:none;background:#0B0C0E;border-bottom:1px solid #262A32;display:flex;align-items:center;gap:20px;padding:0 14px">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:9px;height:9px;background:#5B8DEF"></div>
      <span style="font-size:13px;font-weight:650;letter-spacing:0.06em">ANTI-STRAT</span>
      <span style="font-size:10px;color:#62696D;letter-spacing:0.08em;text-transform:uppercase;border-left:1px solid #262A32;padding-left:8px;margin-left:2px">VALORANT · pro tier</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:8px">
      <span style="font-size:10px;color:#62696D;letter-spacing:0.08em">MATCHES</span>
      <span id="hdr-matches" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#E8E9EA;background:#1B1E24;border:1px solid #262A32;padding:2px 7px">—</span>
      <span style="font-size:10px;color:#62696D;letter-spacing:0.08em;margin-left:6px">MAP RESULTS</span>
      <span id="hdr-maps" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#9AA0A8;background:#1B1E24;border:1px solid #262A32;padding:2px 7px">—</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:6px;background:#131519;border:1px solid #262A32;padding:3px 8px;width:240px">
      <span style="color:#62696D;font-size:12px">&#x2315;</span>
      <input id="search" placeholder="Filter archetype, agent, map&hellip;" style="flex:1;background:transparent;border:none;outline:none;color:#E8E9EA;font-family:inherit;font-size:12px"/>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#9AA0A8">
      <span id="hdr-dot" style="width:5px;height:5px;border-radius:50%;background:#62696D"></span>
      <span id="hdr-status">loading&hellip;</span>
    </div>
  </div>

  <div style="flex:1;display:flex;min-height:0">

    <!-- Sidebar -->
    <div style="width:220px;flex:none;background:#131519;border-right:1px solid #262A32;overflow-y:auto;padding-bottom:20px">

      <div style="padding:12px 12px 10px">
        <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase;margin-bottom:9px">Tier</div>
        <div id="tier-pills" style="display:flex;flex-wrap:wrap;gap:5px"></div>
        <div id="tier-summary" style="font-size:11px;color:#62696D;margin-top:8px;font-family:ui-monospace,'SF Mono',Menlo,monospace"></div>
      </div>

      <div style="border-top:1px solid #262A32;padding:12px 12px 10px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px">
          <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase">Season</div>
          <div id="season-all-btn" style="font-size:10px;letter-spacing:0.06em;color:#9AA0A8;cursor:pointer;text-transform:uppercase">All</div>
        </div>
        <div id="season-pills" style="display:flex;flex-wrap:wrap;gap:5px"></div>
      </div>

      <div style="border-top:1px solid #262A32;padding:12px 12px 10px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px">
          <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase">Region</div>
          <div id="region-all-btn" style="font-size:10px;letter-spacing:0.06em;color:#9AA0A8;cursor:pointer;text-transform:uppercase">All</div>
        </div>
        <div id="region-pills" style="display:flex;flex-wrap:wrap;gap:5px"></div>
      </div>

      <div style="border-top:1px solid #262A32;padding:12px 12px 10px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px">
          <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase">Map</div>
          <div id="map-all-btn" style="font-size:10px;letter-spacing:0.06em;color:#9AA0A8;cursor:pointer;text-transform:uppercase">All</div>
        </div>
        <div id="map-list" style="display:flex;flex-direction:column;gap:1px"></div>
      </div>

      <div style="border-top:1px solid #262A32;padding:12px">
        <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase;margin-bottom:12px">Sample thresholds</div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:#9AA0A8">Min matches</span>
          <span id="lbl-min-matches" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#E8E9EA">10</span>
        </div>
        <input id="sl-min-matches" type="range" min="1" max="200" step="1" value="10" style="margin-bottom:16px"/>
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:#9AA0A8">Min pick rate</span>
          <span id="lbl-min-pick" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#E8E9EA">1%</span>
        </div>
        <input id="sl-min-pick" type="range" min="0" max="30" step="1" value="1"/>
      </div>

      <div style="border-top:1px solid #262A32;padding:12px">
        <div style="font-size:10px;letter-spacing:0.12em;color:#62696D;text-transform:uppercase;margin-bottom:9px">Sample</div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#9AA0A8;padding:3px 0"><span>Map results</span><span id="samp-maps" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#E8E9EA">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#9AA0A8;padding:3px 0"><span>Rows in view</span><span id="samp-rows" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#E8E9EA">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#9AA0A8;padding:3px 0"><span>Filtered out</span><span id="samp-hidden" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#62696D">—</span></div>
      </div>
    </div>

    <!-- Main -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#0B0C0E">

      <!-- Tabs -->
      <div style="flex:none;height:38px;border-bottom:1px solid #262A32;display:flex;align-items:stretch;padding:0 14px;gap:2px">
        <div id="tab-comps" class="tab-btn" style="display:flex;align-items:center;padding:0 14px;font-size:13px;letter-spacing:0.01em">Compositions</div>
        <div id="tab-agents" class="tab-btn" style="display:flex;align-items:center;padding:0 14px;font-size:13px;letter-spacing:0.01em">Agents</div>
        <div id="tab-maps" class="tab-btn" style="display:flex;align-items:center;padding:0 14px;font-size:13px;letter-spacing:0.01em">Map Meta</div>
        <div style="flex:1"></div>
        <div id="scope-label" style="display:flex;align-items:center;font-size:11px;color:#62696D;font-family:ui-monospace,'SF Mono',Menlo,monospace"></div>
      </div>

      <!-- KPI bar -->
      <div id="kpi-bar" style="flex:none;display:flex;align-items:center;border-bottom:1px solid #262A32;background:#0B0C0E"></div>

      <!-- Table -->
      <div id="table-area" style="flex:1;overflow:auto;min-height:0"></div>

      <!-- Status bar -->
      <div style="flex:none;height:26px;border-top:1px solid #262A32;background:#0B0C0E;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:11px;color:#62696D">
        <span id="status-line" style="font-family:ui-monospace,'SF Mono',Menlo,monospace"></span>
        <div style="flex:1"></div>
        <span id="sort-label"></span>
        <span>arch key: <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#9AA0A8">s</span>entinel &middot; <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#9AA0A8">d</span>uelist &middot; <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#9AA0A8">i</span>nitiator &middot; <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#9AA0A8">c</span>ontroller</span>
      </div>
    </div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────

const TIERS = [
  { key:'T1', label:'T1', dot:'#5B8DEF' },
  { key:'T2', label:'T2', dot:'#3BB9C4' },
  { key:'T3', label:'T3', dot:'#9AA0A8' },
  { key:'GC', label:'GC', dot:'#9B66D8' }
];

const ROLE_COLOR = {
  Controller:'#9B66D8', Duelist:'#E5484D',
  Initiator:'#3BB9C4',  Sentinel:'#5B8DEF'
};

const AGENT_ROLE = {
  jett:'Duelist',raze:'Duelist',phoenix:'Duelist',neon:'Duelist',
  reyna:'Duelist',yoru:'Duelist',iso:'Duelist',waylay:'Duelist',
  sova:'Initiator',breach:'Initiator',skye:'Initiator',fade:'Initiator',
  kayo:'Initiator',gekko:'Initiator',tejo:'Initiator',
  viper:'Controller',omen:'Controller',brimstone:'Controller',
  astra:'Controller',harbor:'Controller',clove:'Controller',
  sage:'Sentinel',cypher:'Sentinel',killjoy:'Sentinel',
  chamber:'Sentinel',deadlock:'Sentinel',vyse:'Sentinel'
};

const AGENT_DISPLAY = {
  jett:'Jett',raze:'Raze',phoenix:'Phoenix',neon:'Neon',reyna:'Reyna',
  yoru:'Yoru',iso:'Iso',waylay:'Waylay',
  sova:'Sova',breach:'Breach',skye:'Skye',fade:'Fade',kayo:'KAY/O',
  gekko:'Gekko',tejo:'Tejo',
  viper:'Viper',omen:'Omen',brimstone:'Brimstone',astra:'Astra',
  harbor:'Harbor',clove:'Clove',
  sage:'Sage',cypher:'Cypher',killjoy:'Killjoy',chamber:'Chamber',
  deadlock:'Deadlock',vyse:'Vyse'
};

// ── State ────────────────────────────────────────────────────────────────────

const S = {
  tab: 'comps',
  tiers: { T1:true, T2:true, T3:true, GC:true },
  map: null,
  minMatches: 10,
  minPick: 1,
  query: '',
  sort: {
    comps:  { key:'nm_win_pct', dir:-1 },
    agents: { key:'pick',     dir:-1 },
    maps:   { key:'matches',  dir:-1 }
  },
  rawComps:  [],
  rawAgents: [],
  rawMaps:   [],
  mapList:   [],
  totalMatches: 0,
  totalMapResults: 0,
  agentData: {},
  mapData: {},
  roleData: {},
  expanded: new Set(),
  seasons: {},   // { "2026": true, ... } — all true by default after load
  regions: {},   // { "Americas": true, ... }
  availSeasons: [],
  availRegions: []
};

// ── Helpers ──────────────────────────────────────────────────────────────────

const num    = n => Math.round(n).toLocaleString('en-US');
const wrColor = v => v >= 52 ? '#46A758' : v >= 47.5 ? '#5B8DEF' : '#E5484D';
const barW    = v => Math.max(2, Math.min(100, (v - 35) / 30 * 100)).toFixed(1) + '%';
const activeTiers   = () => TIERS.filter(t => S.tiers[t.key]);
const tierParam     = () => activeTiers().map(t => t.key).join(',');
const activeSeasons = () => S.availSeasons.filter(s => S.seasons[s] !== false);
const activeRegions = () => S.availRegions.filter(r => S.regions[r] !== false);
const seasonParam   = () => activeSeasons().join(',');
const regionParam   = () => activeRegions().join(',');

function expandArch(arch) {
  const map = { s:'Sentinel', d:'Duelist', i:'Initiator', c:'Controller' };
  const slots = [];
  for (const m of (arch.match(/(\d+)([sdic])/g) || [])) {
    const [, n, r] = m.match(/(\d+)([sdic])/);
    for (let j = 0; j < +n; j++) slots.push(map[r]);
  }
  while (slots.length < 5) slots.push(null);
  return slots.slice(0, 5);
}

function archSquares(arch) {
  return expandArch(arch).map(role => {
    const icon = role && S.roleData[role];
    if (icon) return `<img src="${icon}" style="width:14px;height:14px;flex:none;opacity:0.75" title="${role}">`;
    return `<span style="width:4px;height:14px;background:${role ? ROLE_COLOR[role] : '#2A2F38'};flex:none;display:inline-block"></span>`;
  }).join('');
}

// ── Aggregation ──────────────────────────────────────────────────────────────

function aggComps() {
  const agg = {};
  for (const r of S.rawComps) {
    if (!agg[r.comp]) agg[r.comp] = {
      comp:r.comp, wins:0, total:0,
      atk_wins:0, atk_rounds:0, def_wins:0, def_rounds:0,
      nm_wins:0, nm_total:0, agents:{}, luMap:{}, teamMap:{}
    };
    const a = agg[r.comp];
    a.wins       += r.wins;
    a.total      += r.total;
    a.atk_wins   += r.atk_wins   || 0;
    a.atk_rounds += r.atk_rounds || 0;
    a.def_wins   += r.def_wins   || 0;
    a.def_rounds += r.def_rounds || 0;
    a.nm_wins    += r.nm_wins    || 0;
    a.nm_total   += r.nm_total   || 0;
    for (const [ag, cnt] of Object.entries(r.agents || {}))
      a.agents[ag] = (a.agents[ag] || 0) + cnt;
    for (const lu of r.lineups || []) {
      const lk = lu.agents.slice().sort().join(',');
      if (!a.luMap[lk]) a.luMap[lk] = { agents: lu.agents, wins: 0, total: 0 };
      a.luMap[lk].wins  += lu.wins;
      a.luMap[lk].total += lu.total;
    }
    for (const tm of r.teams || []) {
      if (!a.teamMap[tm.team]) a.teamMap[tm.team] = { wins: 0, total: 0 };
      a.teamMap[tm.team].wins  += tm.wins;
      a.teamMap[tm.team].total += tm.total;
    }
  }
  return Object.values(agg).map(c => ({
    comp:           c.comp,
    wins:           c.wins,
    total:          c.total,
    win_pct:        c.total      ? c.wins     / c.total      * 100 : 0,
    atk_wr:         c.atk_rounds ? c.atk_wins / c.atk_rounds * 100 : null,
    def_wr:         c.def_rounds ? c.def_wins / c.def_rounds * 100 : null,
    nm_total:       c.nm_total,
    nm_win_pct:     c.nm_total   ? c.nm_wins  / c.nm_total   * 100 : null,
    mirror_matches: (c.total - c.nm_total) / 2,
    agents:         c.agents,
    lineups:        Object.values(c.luMap)
      .map(lu => ({ ...lu, win_pct: lu.total ? lu.wins/lu.total*100 : 0 }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 12),
    teams:          Object.entries(c.teamMap)
      .map(([team, s]) => ({ team, wins: s.wins, total: s.total, win_pct: s.total ? s.wins/s.total*100 : 0 }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 20),
  }));
}

function aggAgents() {
  const agg = {};
  for (const r of S.rawAgents) {
    if (!agg[r.agent]) agg[r.agent] = { agent:r.agent, picks:0, wins:0 };
    agg[r.agent].picks += r.picks;
    agg[r.agent].wins  += r.wins;
  }
  const totalPicks = Object.values(agg).reduce((s, a) => s + a.picks, 0);
  return Object.values(agg).map(a => ({
    agent:   a.agent,
    name:    AGENT_DISPLAY[a.agent] || a.agent,
    role:    AGENT_ROLE[a.agent]    || 'Unknown',
    picks:   a.picks,
    wins:    a.wins,
    win_pct: a.picks ? a.wins / a.picks * 100 : 0,
    // pick% = % of teams that ran this agent (totalPicks/5 = total team appearances)
    pick:    totalPicks ? a.picks / (totalPicks / 5) * 100 : 0
  }));
}

function topArchForMap(mapName) {
  const forMap = S.rawComps.filter(c => c.map === mapName);
  if (!forMap.length) return null;
  return forMap.reduce((best, c) => c.total > best.total ? c : best);
}

// ── Valorant API ─────────────────────────────────────────────────────────────

async function loadValApiData() {
  if (Object.keys(S.agentData).length) return;
  try {
    const [aRes, mRes] = await Promise.all([
      fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true'),
      fetch('https://valorant-api.com/v1/maps')
    ]);
    const [aJson, mJson] = await Promise.all([aRes.json(), mRes.json()]);
    for (const a of aJson.data) {
      const key = a.displayName.toLowerCase().replace(/[^a-z]/g, '');
      S.agentData[key] = {
        icon:     a.displayIcon,
        roleIcon: a.role?.displayIcon || ''
      };
      if (a.role?.displayName && !S.roleData[a.role.displayName])
        S.roleData[a.role.displayName] = a.role.displayIcon;
    }
    for (const m of mJson.data) {
      if (!m.displayName) continue;
      S.mapData[m.displayName.toLowerCase()] = {
        listIcon: m.listViewIcon || m.displayIcon
      };
    }
  } catch(e) {
    console.warn('val-api unavailable', e);
  }
}

// ── API Fetch ────────────────────────────────────────────────────────────────

async function loadFilters() {
  if (S.availSeasons.length) return;
  try {
    const res = await fetch('/api/filters');
    const { seasons, regions } = await res.json();
    S.availSeasons = seasons;
    S.availRegions = regions;
  } catch(e) { console.warn('filters unavailable', e); }
}

async function fetchData() {
  const tiers   = encodeURIComponent(tierParam());
  const seasons = encodeURIComponent(seasonParam());
  const regions = encodeURIComponent(regionParam());
  const map     = encodeURIComponent(S.map || '');
  setStatus('dim', 'loading…');

  try {
    await Promise.all([loadValApiData(), loadFilters()]);
    const [cRes, aRes, mRes, sRes] = await Promise.all([
      fetch(`/api/comps?tiers=${tiers}&seasons=${seasons}&regions=${regions}&map=${map}&min_sample=1`),
      fetch(`/api/agents?tiers=${tiers}&seasons=${seasons}&regions=${regions}&map=${map}&min_sample=1`),
      fetch(`/api/maps/meta?tiers=${tiers}&seasons=${seasons}&regions=${regions}`),
      fetch('/api/stats')
    ]);

    S.rawComps  = await cRes.json();
    S.rawAgents = await aRes.json();
    S.rawMaps   = await mRes.json();
    const stats = await sRes.json();

    S.totalMatches    = stats.matches     || 0;
    S.totalMapResults = stats.map_results || 0;
    S.mapList = [...S.rawMaps].sort((a, b) => b.total - a.total);

    document.getElementById('hdr-matches').textContent = num(S.totalMatches);
    document.getElementById('hdr-maps').textContent    = num(S.totalMapResults);
    setStatus('live', num(S.totalMatches) + ' matches');

    render();
  } catch(e) {
    setStatus('err', 'connection error');
    console.error(e);
  }
}

// ── Render ───────────────────────────────────────────────────────────────────

function setStatus(kind, text) {
  document.getElementById('hdr-dot').style.background =
    kind === 'live' ? '#46A758' : kind === 'err' ? '#E5484D' : '#62696D';
  document.getElementById('hdr-status').textContent = text;
}

function render() {
  renderSidebar();
  renderTabs();
  renderMain();
}

function renderSidebar() {
  // Tier pills
  const pills = document.getElementById('tier-pills');
  pills.innerHTML = '';
  TIERS.forEach(t => {
    const on = S.tiers[t.key];
    const el = document.createElement('div');
    el.className = 'pill';
    el.style.cssText = `display:flex;align-items:center;gap:6px;padding:4px 9px;font-size:12px;border:1px solid ${on?'#3A3F47':'#1E2127'};background:${on?'#1B1E24':'transparent'};color:${on?'#E8E9EA':'#62696D'}`;
    el.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${on?t.dot:'#3A3F47'}"></span>${t.label}`;
    el.onclick = () => { S.tiers[t.key] = !S.tiers[t.key]; fetchData(); };
    pills.appendChild(el);
  });
  const active = activeTiers();
  document.getElementById('tier-summary').textContent = active.length
    ? active.map(t => t.key).join('+') + ' · ' + num(S.totalMatches) + ' matches'
    : 'no tiers selected';

  // Season pills
  function makePills(containerId, keys, stateObj, onChange) {
    const c = document.getElementById(containerId);
    c.innerHTML = '';
    keys.forEach(k => {
      const on = stateObj[k] !== false;
      const el = document.createElement('div');
      el.className = 'pill';
      el.style.cssText = `padding:3px 8px;font-size:11px;border:1px solid ${on?'#3A3F47':'#1E2127'};background:${on?'#1B1E24':'transparent'};color:${on?'#E8E9EA':'#62696D'}`;
      el.textContent = k;
      el.onclick = () => { stateObj[k] = !on; onChange(); };
      c.appendChild(el);
    });
  }

function buildKpis() {
  if (S.tab === 'comps') {
    const { rows, total } = filteredComps();
    const nmRows = rows.filter(r => r.nm_win_pct != null);
    const avgNmWr = nmRows.length ? nmRows.reduce((s,r)=>s+r.nm_win_pct,0)/nmRows.length : null;
    const top = nmRows.length ? [...nmRows].sort((a,b)=>b.nm_win_pct-a.nm_win_pct)[0] : null;
    const mirrorTotal = rows.reduce((s,r)=>s+(r.mirror_matches||0),0);
    return [
      { label:'Archetypes in view', value:String(rows.length), sub:'of '+total },
      { label:'Avg non-mirror WR',
        value: avgNmWr != null ? avgNmWr.toFixed(1)+'%' : '—',
        sub:   avgNmWr != null ? (avgNmWr>=50?'above even':'below even') : '',
        subColor: avgNmWr != null ? (avgNmWr>=50?'#46A758':'#E5484D') : '#62696D' },
      { label:'Top non-mirror WR', value:top?top.nm_win_pct.toFixed(1)+'%':'—', sub:top?top.comp:'', subColor:'#9AA0A8' },
      { label:'Mirror matches', value:num(mirrorTotal), sub:'excluded from WR' }
    ];
  }
  if (S.tab === 'agents') {
    const { rows, total } = filteredAgents();
    const avgWr  = rows.length ? rows.reduce((s,r)=>s+r.win_pct,0)/rows.length : null;
    const topPk  = rows.length ? [...rows].sort((a,b)=>b.pick-a.pick)[0] : null;
    return [
      { label:'Agents in view', value:String(rows.length), sub:'of '+total },
      { label:'Avg win rate',
        value: avgWr ? avgWr.toFixed(1)+'%' : '—',
        sub:   avgWr ? (avgWr>=50?'above even':'below even') : '',
        subColor: avgWr ? (avgWr>=50?'#46A758':'#E5484D') : '#62696D' },
      { label:'Highest team pick%', value:topPk?topPk.pick.toFixed(1)+'%':'—', sub:topPk?topPk.name:'', subColor:'#9AA0A8' },
      { label:'Map results', value:num(S.totalMapResults), sub:'total in db' }
    ];
  }
  // maps tab
  const { rows } = filteredMaps();
  const top = rows.length ? [...rows].sort((a,b)=>b.matches-a.matches)[0] : null;
  const withRounds = rows.filter(m => m.atk_wr != null);
  const avgAtk = withRounds.length ? withRounds.reduce((s,m)=>s+m.atk_wr,0)/withRounds.length : null;
  return [
    { label:'Maps in pool', value:String(rows.length), sub:S.map?'filtered':'all' },
    { label:'Avg attack WR', value:avgAtk?avgAtk.toFixed(1)+'%':'—', sub:withRounds.length?'across maps':'no round data', subColor:avgAtk?(Math.abs(avgAtk-50)<1?'#9AA0A8':avgAtk>50?'#E5484D':'#46A758'):'#62696D' },
    { label:'Most played', value:top?num(top.matches):'—', sub:top?top.name:'', subColor:'#9AA0A8' },
    { label:'Map results', value:num(S.totalMapResults), sub:'total in db' }
  ];
}

// ── Filtering & sorting ───────────────────────────────────────────────────────

function filteredComps() {
  const all = aggComps();
  const q   = S.query.trim().toLowerCase();
  const rows = all.filter(r => r.total >= S.minMatches && (!q || r.comp.includes(q)));
  return { rows: sortRows(rows, 'comps'), total: all.length };
}

function filteredAgents() {
  const all = aggAgents();
  const q   = S.query.trim().toLowerCase();
  const rows = all.filter(a =>
    a.pick >= S.minPick &&
    (!q || (a.name + ' ' + a.role).toLowerCase().includes(q))
  );
  return { rows: sortRows(rows, 'agents'), total: all.length };
}

function filteredMaps() {
  const q   = S.query.trim().toLowerCase();
  const all = S.rawMaps.map(m => ({
    name:          m.map,
    matches:       m.total,
    atk_wr:        m.atk_wr,
    avg_rounds:    m.avg_rounds,
    pistol_atk_wr: m.pistol_atk_wr,
  }));
  const rows = all.filter(m => !q || m.name.toLowerCase().includes(q));
  return { rows: sortRows(rows, 'maps'), total: all.length };
}

function sortRows(rows, tab) {
  const { key, dir } = S.sort[tab];
  return rows.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return typeof x === 'string' ? x.localeCompare(y) * dir : (x - y) * dir;
  });
}

// ── Table rendering ───────────────────────────────────────────────────────────

function renderTable() {
  const area = document.getElementById('table-area');
  let el, rows, total;

  if (S.tab === 'comps') {
    ({ rows, total } = filteredComps());
    el = buildCompsTable(rows);
    setSample(rows.length, total);
  } else if (S.tab === 'agents') {
    ({ rows, total } = filteredAgents());
    el = buildAgentsTable(rows);
    setSample(rows.length, total);
  } else {
    ({ rows, total } = filteredMaps());
    el = buildMapsTable(rows);
    setSample(rows.length, total);
  }
  area.replaceChildren(el);
}

function setSample(visible, total) {
  document.getElementById('samp-maps').textContent   = num(S.totalMapResults);
  document.getElementById('samp-rows').textContent   = String(visible);
  document.getElementById('samp-hidden').textContent = String(total - visible);
}

function hdrRow(cols, tab) {
  const { key: sk, dir: sd } = S.sort[tab];
  const el = document.createElement('div');
  el.style.cssText = `display:grid;grid-template-columns:${cols.map(c=>c.w).join(' ')};align-items:center;background:#1B1E24;border-bottom:1px solid #262A32;position:sticky;top:0;z-index:2;height:30px;padding:0 14px`;
  cols.forEach(c => {
    const cell = document.createElement('div');
    const align = c.right ? 'text-align:right;' : c.pl ? 'padding-left:18px;' : '';
    cell.style.cssText = `font-size:10px;letter-spacing:0.1em;text-transform:uppercase;${align}${c.sort ? 'cursor:pointer;color:#9AA0A8;' : 'color:#62696D;'}`;
    if (c.sort) cell.className = 'sort-hd';
    const arrow = c.sort && sk === c.sort ? (sd === -1 ? '▾' : '▴') : '';
    cell.innerHTML = c.label + (arrow ? ` <span style="color:#5B8DEF">${arrow}</span>` : '');
    if (c.sort) cell.onclick = () => {
      const cur = S.sort[tab];
      S.sort[tab] = cur.key === c.sort
        ? { key:c.sort, dir:-cur.dir }
        : { key:c.sort, dir:c.asc ? 1 : -1 };
      renderMain();
    };
    el.appendChild(cell);
  });
  return el;
}

function emptyRow(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'padding:40px 16px;color:#62696D;font-size:12px';
  el.textContent = msg;
  return el;
}

        <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:#9AA0A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${topLabel}</span>
      </div>`;
    el.onclick = () => { S.map = S.map === r.name ? null : r.name; fetchData(); };
    wrap.appendChild(el);
  });
  return wrap;
}

// ── Status bar ────────────────────────────────────────────────────────────────

function renderStatusBar() {
  const { key, dir } = S.sort[S.tab];
  document.getElementById('status-line').textContent =
    `antistrat://${S.tab}?tier=${tierParam()||'none'}&map=${S.map||'all'}&min=${S.minMatches}`;
  document.getElementById('sort-label').innerHTML =
    `sort: <span style="color:#9AA0A8;font-family:ui-monospace,'SF Mono',Menlo,monospace">${key} ${dir===-1?'desc':'asc'}</span>`;
}

// ── Events ───────────────────────────────────────────────────────────────────

['comps','agents','maps'].forEach(k => {
  document.getElementById('tab-'+k).onclick = () => {
    S.tab = k; renderTabs(); renderMain();
  };
});

document.getElementById('map-all-btn').onclick    = () => { S.map = null; fetchData(); };
document.getElementById('season-all-btn').onclick = () => { S.availSeasons.forEach(s => delete S.seasons[s]); fetchData(); };
document.getElementById('region-all-btn').onclick = () => { S.availRegions.forEach(r => delete S.regions[r]); fetchData(); };

let _st;
document.getElementById('search').oninput = e => {
  clearTimeout(_st);
  _st = setTimeout(() => { S.query = e.target.value; renderMain(); }, 120);
};

document.getElementById('sl-min-matches').oninput = e => {
  S.minMatches = +e.target.value;
  document.getElementById('lbl-min-matches').textContent = e.target.value;
  renderMain();
};

document.getElementById('sl-min-pick').oninput = e => {
  S.minPick = +e.target.value;
  document.getElementById('lbl-min-pick').textContent = e.target.value + '%';
  renderMain();
};

// ── Init ─────────────────────────────────────────────────────────────────────

fetchData();
</script>
</body>
</html>
